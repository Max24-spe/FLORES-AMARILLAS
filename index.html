<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas Para Ti 🌻</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            text-align: center;
        }
        .mensaje {
            z-index: 10;
            margin-bottom: 50px;
            animation: fadeIn 3s ease-in-out;
        }
        h1 {
            color: #FFD700;
            text-shadow: 0 0 15px #FF8C00;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #e0e0e0;
        }
        /* Girasol CSS */
        .flower {
            position: relative;
            width: 100px;
            height: 100px;
            animation: pulse 2.5s infinite alternate ease-in-out;
        }
        .petal {
            position: absolute;
            width: 30px;
            height: 110px;
            background: linear-gradient(#FFD700, #FF8C00);
            border-radius: 50px;
            top: -55px;
            left: 35px;
            transform-origin: bottom center;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }
        /* Posicionamiento de los pétalos */
        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }
        
        .center {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(#5c2c06, #361700);
            border-radius: 50%;
            top: 20px;
            left: 20px;
            z-index: 2;
            box-shadow: inset 0 0 15px #000;
        }
        .stem {
            position: absolute;
            width: 12px;
            height: 200px;
            background: linear-gradient(to right, #228B22, #006400);
            top: 80px;
            left: 44px;
            z-index: -1;
            border-radius: 10px;
        }
        .leaf {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #228B22;
            border-radius: 0 50% 0 50%;
            top: 130px;
            left: 55px;
            z-index: -2;
            transform: rotate(15deg);
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="mensaje">
        <h1>¡Feliz Día de las Flores Amarillas! 💛</h1>
        <p>Un detalle virtual para alegrar tu día.</p>
    </div>
    
    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
    </div>
</body>
</html>
